name: Run room review fixes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-review-findings
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted fixes
        run: python .github/apply_room_review_fixes.py

      - name: Format changed files
        run: >-
          npx prettier
          src/room/scorer/ScorerRecovery.ts
          src/room/scorer/GameSession.ts
          src/room/scorer/PlayersDialog.tsx
          src/room/scorer/useGameEvents.ts
          src/room/scorer/ScorerDialog.tsx
          src/room/scorer/OperationsDialogs.tsx
          src/room/scorer/Scorer.tsx
          src/room/scoring/deriveGame.ts
          src/room/ManualRoomApp.tsx
          src/main/server/Router.ts
          src/room/scorer/ScorerRecovery.test.ts
          --write

      - name: Commit source fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/room/scorer/ScorerRecovery.ts src/room/scorer/GameSession.ts src/room/scorer/PlayersDialog.tsx src/room/scorer/useGameEvents.ts src/room/scorer/ScorerDialog.tsx src/room/scorer/OperationsDialogs.tsx src/room/scorer/Scorer.tsx src/room/scoring/deriveGame.ts src/room/ManualRoomApp.tsx src/main/server/Router.ts src/room/scorer/ScorerRecovery.test.ts
          git diff --cached --check
          git commit -m "Fix verified room review findings"
          git push origin HEAD:fix/room-review-findings

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run check-format

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Mark validation passed
        run: |
          touch .room-review-validation-passed
          git add .room-review-validation-passed
          git commit -m "test: validate room review fixes"
          git push origin HEAD:fix/room-review-findings
