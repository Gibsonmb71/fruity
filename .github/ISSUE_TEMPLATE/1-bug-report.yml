name: Bug report
description: Something in Fruity is broken or behaves incorrectly. 🐞
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste room access tokens, session tokens, or pairing codes into this issue.** It is public.
        Scrub rosters and team names too if the tournament data is not already public. If a credential is the
        only way to explain the bug, say so and leave it out — a maintainer will follow up privately.

        If this is a security problem in the tournament server, pairing, or session handling, close this form and
        use [Report a security vulnerability](https://github.com/gbyo/fruity/security/advisories/new) instead. That
        form is private to maintainers.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest release, or a recent build of `master`.
          required: true
        - label: I have removed any tokens, pairing codes, or private tournament data from this report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does this happen? Pick the closest one.
      options:
        - Tournament setup (teams, rules, stages, pools, rounds)
        - Match Plan and scheduling
        - Tournament Control
        - Browser room scoring
        - Public pairings or Live Display
        - Reports and exports (HTML, QBJ, SQBS, .yft)
        - File import or opening a tournament
        - Statistics or scoring math
        - Something else / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, including any error message shown.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number them. Include the tournament format if the bug depends on it (stages, pools, carryover, rebracketing).
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Fruity version
      description: From **Help → About**, or the commit you built from.
      placeholder: 4.0.18, or commit fd61f8c8
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15.3 (Apple silicon), Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: room-details
    attributes:
      label: Room and device details
      description: >
        Only for browser room scoring, public pairings, or the Live Display. Which device and browser was in the
        room, was the Local Tournament Server running, and was the room paired by QR code or pairing code?
      placeholder: Chromebook, Chrome 132, server running on the control laptop, paired by QR code.

  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, or a tournament file
      description: >
        Attach anything that helps. Screenshots are usually enough. Only attach a `.yft` or QBJ file if the data
        in it can be public — otherwise say you have one and a maintainer will arrange a private copy.

  - type: checkboxes
    id: during-tournament
    attributes:
      label: Impact
      options:
        - label: This happened during a live tournament.
          required: false
